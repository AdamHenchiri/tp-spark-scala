app {
  # Surchargeable au lancement : -Dapp.spark.master=...
  spark.master = "local[*]"
  spark.master = ${?SPARK_MASTER}

  bronze.path = "data/bronze"
  silver.path = "data/silver"

  # APIs data.gouv.fr utilisées par la zone Bronze (publiques, sans clé)
  api {
    base-url    = "https://www.data.gouv.fr/api/1"          # catalogue : retrouve l'id d'une ressource
    tabular-url = "https://tabular-api.data.gouv.fr/api"    # API tabulaire : les lignes de données
    page-size   = 50                                        # lignes par appel
  }

  # Un bloc par jeu de données.
  #   name           : nom du dossier Parquet en Silver
  #   file           : fichier déposé en Bronze (JSON Lines : une ligne de l'API = une ligne du fichier)
  #   format         : json (données de l'API) ou csv (fichier téléchargé à la main)
  #   resource-id    : identifiant de la ressource (onglet "Métadonnées" sur data.gouv.fr)
  #   slug           : (si pas de resource-id) jeu de données dans l'URL data.gouv.fr ; son 1er CSV est utilisé
  #   resource-title : (optionnel, avec slug) texte contenu dans le titre de la ressource à prendre
  datasets = [
    { name = "bac",            file = "bac.jsonl",            format = "json", sep = ";"
      slug = "le-baccalaureat-par-academie" }
    { name = "academies",      file = "academies.jsonl",      format = "json", sep = ";"
      slug = "contour-academies-2020" }
    { name = "etablissements", file = "etablissements.jsonl", format = "json", sep = ";"
      slug = "implantations-des-etablissements-denseignement-superieur-publics" }
  ]

  gold {
    etablissements.table = "GOLD_ETABLISSEMENTS_PAR_TYPE"
    bac.table            = "GOLD_TAUX_REUSSITE_BAC"
  }

  # Base Oracle de la zone Gold. Les valeurs viennent du fichier .env (non commité)
  # ou des variables d'environnement du même nom.
  db {
    url      = "jdbc:oracle:thin:@//localhost:1521/XEPDB1"
    url      = ${?DB_URL}
    user     = ""
    user     = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
    driver   = "oracle.jdbc.OracleDriver"
    driver   = ${?DB_DRIVER}
  }
}
